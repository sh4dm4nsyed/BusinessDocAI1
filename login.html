<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BusinessDoc AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    <div class="login-card">
        <div class="login-header">
            <a href="index.html" class="login-logo-link">BusinessDoc AI</a>
            <h2>Willkommen zurück</h2>
            <p>Melden Sie sich an, um fortzufahren.</p>
        </div>
        
        <form class="login-form">
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" placeholder="ihre.email@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-button" onclick="window.location.href='page.html'; return false;">
                Login
            </button>
        </form>

        <div class="login-footer">
            <p>Noch kein Konto? <a href="#" class="register-link">Registrieren</a></p>
            <p><a href="#" class="forgot-password-link">Passwort vergessen?</a></p>
        </div>
    </div>
</body>
</html>
